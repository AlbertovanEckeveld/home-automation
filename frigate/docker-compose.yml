#version: '3.8'

services:

  frigate:
    container_name: frigate
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "64mb"  # Increase to 128mb+ for more cameras
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - frigate_storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000  # 1GB RAM cache
    ports:
      - "5000:5000"      # Web UI
      - "8554:8554"      # RTSP feeds
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - CAM1_IP=${CAM1_IP}
      - CAM1_ADMIN_USER=${CAM1_ADMIN_USER}
      - CAM1_ADMIN_PASSWORD=${CAM1_ADMIN_PASSWORD}
      - CAM1_RTSP_SUB_STREAM=${CAM1_RTSP_SUB_STREAM}
      - CAM1_RTSP_MAIN_STREAM=${CAM1_RTSP_MAIN_STREAM}
      - CAM2_IP=${CAM2_IP}
      - CAM2_ADMIN_USER=${CAM2_ADMIN_USER}
      - CAM2_ADMIN_PASSWORD=${CAM2_ADMIN_PASSWORD}
      - CAM2_RTSP_SUB_STREAM=${CAM2_RTSP_SUB_STREAM}
      - CAM2_RTSP_MAIN_STREAM=${CAM2_RTSP_MAIN_STREAM}


volumes:
  frigate_storage:
