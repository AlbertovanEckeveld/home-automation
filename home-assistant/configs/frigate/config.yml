mqtt:
  enabled: false

ffmpeg:
  input_args: preset-rtsp-generic

objects:
  track:
    - person
    - car
    - dog

# Global recording settings
record:
  enabled: true
  retain:
    days: 30        # Keep all recordings for 30 days
    mode: motion   # Only record when motion detected

cameras:
  front_garden:
    enabled: true
    ffmpeg:
      inputs:
        # Main stream for recording (high quality)
        - path: rtsp://${CAM2_ADMIN_USER}:${CAM2_ADMIN_PASSWORD}@${CAM2_IP}:554/${CAM2_RTSP_MAIN_STREAM}
          roles:
            - record
        # Sub stream for detection (low quality = less CPU)
        - path: rtsp://${CAM2_ADMIN_USER}:${CAM2_ADMIN_PASSWORD}@${CAM2_IP}:554/${CAM2_RTSP_SUB_STREAM}
          roles:
            - detect
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14  # Keep important detections longer
        pre_capture: 5
        post_capture: 5
      detections:
        retain:
          days: 7
        pre_capture: 3
        post_capture: 3
