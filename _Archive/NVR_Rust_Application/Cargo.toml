[package]
name = "skybase-surveillance"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }